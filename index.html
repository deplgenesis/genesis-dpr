<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genesis DPR</title>
<meta name="description" content="Project Genesis Daily Progress Report - Dinesh Engineers Ltd.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Genesis DPR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; background: #ffffff; }
  #cover { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; background: #ffffff; color: #14171C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px 30px; transition: opacity 250ms ease; }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover { gap: 34px; }
  #cover img { width: 232px; max-width: 70vw; height: auto; display: block; }
  #coverMsg { font-size: 15px; font-weight: 700; color: #14171C; max-width: 300px; line-height: 1.45; }
  #coverMsg:empty { display: none; }
  #bar { width: 120px; height: 4px; border-radius: 2px; background: #E7E5DF; overflow: hidden; }
  #bar i { display: block; width: 45%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #0b1f8a, #1a5fd0, #12a9d8, #14b3a6, #4cae2f); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  #retry { display: none; min-height: 46px; padding: 0 28px; border: 0; border-radius: 14px; background: #14171C; color: #ffffff; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; cursor: pointer; }
  #cover.err #bar { display: none; }
  #cover.err #retry { display: inline-flex; align-items: center; justify-content: center; }
  @media (prefers-reduced-motion: reduce) { #bar i { animation: none; width: 100%; } #cover { transition: none; } }
</style>
</head>
<body>

<iframe id="app" title="Genesis DPR" allow="geolocation *; camera *; microphone *; web-share *; clipboard-write *; fullscreen *"></iframe>

<div id="cover" role="status" aria-live="polite">
  <img src="sticker.png" alt="Project Genesis">
  <div id="bar"><i></i></div>
  <div id="coverMsg"></div>
  <button type="button" id="retry">Try again</button>
</div>

<script>
/* ===== THE ONLY LINE TO CHANGE: your Apps Script web app link (it ends in /exec) ===== */
var APP_URL = 'https://script.google.com/macros/s/AKfycbwIKADjX6K9_T6NjSINnGyg2xNdHD4VFp871MPi9G65AUFC_kLyrAXcvfeGxV9Wxnbcqw/exec';
/* ======================================================================================= */

(function () {
  var frame = document.getElementById('app');
  var cover = document.getElementById('cover');
  var msg = document.getElementById('coverMsg');
  var retry = document.getElementById('retry');
  var slowTimer = null;
  var loadedOnce = false;

  var URL_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[A-Za-z0-9._-]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/;

  function showMsg(text, isError) {
    msg.textContent = text;
    cover.classList.remove('hide');
    if (isError) cover.classList.add('err'); else cover.classList.remove('err');
  }

  /* ?page=dashboard on the wrapper link opens the dashboard */
  function targetUrl() {
    var u = APP_URL;
    try {
      var p = new URLSearchParams(window.location.search).get('page');
      if (p === 'dashboard') u += (u.indexOf('?') < 0 ? '?' : '&') + 'page=dashboard';
    } catch (e) { /* ignore */ }
    return u;
  }

  function start() {
    clearTimeout(slowTimer);
    if (!URL_OK.test(String(APP_URL).trim())) {
      showMsg('Setup needed. The app link in index.html is missing or is not a valid Apps Script /exec link.', true);
      return;
    }
    if (navigator.onLine === false) {
      showMsg('No internet. Connect to the internet and try again.', true);
      return;
    }
    showMsg('', false);
    frame.src = targetUrl();
    slowTimer = setTimeout(function () {
      if (!loadedOnce) showMsg('This is taking longer than usual. Check your signal and try again.', true);
    }, 25000);
  }

  frame.addEventListener('load', function () {
    /* the blank frame fires load too; only react once a real address is set */
    if (!frame.getAttribute('src')) return;
    loadedOnce = true;
    clearTimeout(slowTimer);
    setTimeout(function () { cover.classList.add('hide'); }, 250);
  });

  retry.addEventListener('click', function () {
    loadedOnce = false;
    frame.removeAttribute('src');
    start();
  });

  window.addEventListener('online', function () {
    if (!loadedOnce) start();
  });
  window.addEventListener('offline', function () {
    if (!loadedOnce) showMsg('No internet. Connect to the internet and try again.', true);
  });

  start();

  /* small offline shell only; errors are ignored */
  window.addEventListener('load', function () {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ });
    }
  });
})();
</script>
</body>
</html>
